<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">screen-studio-editor 清理 Screen Studio 工程时间线</title>
  <desc id="desc">左侧是项目名称和用途，右侧是一条带删除区间的 Screen Studio 时间线：停顿被标出，确认后再写入工程。</desc>

