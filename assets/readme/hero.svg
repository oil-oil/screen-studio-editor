    <text x="52" y="128" fill="#F6F1EA" font-size="48" font-weight="760" letter-spacing="-1.5">screen-studio-editor</text>
    <text x="56" y="176" fill="#E4D9CC" font-size="24" font-weight="560">清理录屏工程里的停顿、误讲和重复</text>
    <text x="56" y="210" fill="#E4D9CC" font-size="24" font-weight="560">先出报告，确认后再写入时间线</text>

    <g transform="translate(56 268)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="650">
      <circle cx="5" cy="-5" r="5" fill="#FF6A3D"/>
